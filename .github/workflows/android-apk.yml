name: Build Anonixex Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Anonixex-Launcher.apk

      # GitHub Actions artifacts are always ZIP-wrapped. This is only a backup;
      # the GitHub Release below publishes the raw .apk as a direct download.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonixex-launcher-build
          path: app/build/outputs/apk/debug/Anonixex-Launcher.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.1.0-build-${{ github.run_number }}
          name: Anonixex Launcher v0.1.0 (Build ${{ github.run_number }})
          body: |
            First public Anonixex Android launcher build.

            Download **Anonixex-Launcher.apk** below and install it on your Android phone.
            Android may ask you to allow installation from the browser or file manager you used.

            This is an early-access debug build. It is not the Anonixex operating system yet.
          prerelease: false
          files: app/build/outputs/apk/debug/Anonixex-Launcher.apk
          overwrite_files: true
